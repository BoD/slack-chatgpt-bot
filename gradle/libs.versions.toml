[versions]
kotlin = "2.4.21"
kotlinx-coroutines = "1.10.2"
kotlinx-cli = "0.3.6"
klibnanolog = "1.3.0"
logback = "1.6.5"
klibopenai = "1.0.1"
klibslack = "1.0.3"
dockerJavaApplication = "10.0.0"
tapmoc = "0.5.0"

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
dockerJavaApplication = { id = "com.bmuschko.docker-java-application", version.ref = "dockerJavaApplication" }
tapmoc = { id = "com.gradleup.tapmoc", version.ref = "tapmoc" }

[libraries]
klibnanolog = { group = "org.jraf.klibnanolog", name = "klibnanolog", version.ref = "klibnanolog" }
logback = { group = "ch.qos.logback", name = "logback-classic", version.ref = "logback" }
kotlinx-coroutines-jdk9 = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-jdk9", version.ref = "kotlinx-coroutines" }
klibslack = { group = "org.jraf.klibslack", name = "klibslack", version.ref = "klibslack" }
kotlinx-cli = { group = "org.jetbrains.kotlinx", name = "kotlinx-cli", version.ref = "kotlinx-cli" }
klibopenai = { group = "org.jraf.klibopenai", name = "klibopenai", version.ref = "klibopenai" }
